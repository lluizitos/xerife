<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#121417">
<title>Xerife · DVD</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#121417;--card:#1b1f24;--line:#2a3038;--fg:#eef1f4;--muted:#9aa3ad;--gold:#e6a93a;--ok:#4cc782;--blue:#8e9bff;--dim:#59616b;--err:#ff7a6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 130px max(16px,env(safe-area-inset-left))}
.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand img{height:54px;width:auto;display:block}
.brand span{color:var(--dim);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.eyebrow{color:var(--gold);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
h1{font-family:"Barlow Condensed",sans-serif;font-size:44px;line-height:1;margin:4px 0 6px;letter-spacing:.02em}
h2{font-family:"Barlow Condensed",sans-serif;font-size:26px;margin:30px 0 4px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:14px;line-height:1.45}
.count{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.count span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--muted)}
.count b{color:var(--fg)}
.list{display:grid;gap:10px;margin-top:18px}
.song,.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:12px;align-items:center}
.n{font-family:"Barlow Condensed",sans-serif;font-size:26px;color:var(--dim);width:28px;text-align:center;flex:none}
.info{flex:1;min-width:0}
.name{font-weight:600;font-size:17px;line-height:1.2}
.meta{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.tag{font-weight:600;border-radius:999px;padding:2px 9px;font-size:12px}
.t-aprovada{background:rgba(76,199,130,.15);color:var(--ok)}.t-previa{background:rgba(142,155,255,.15);color:var(--blue)}.t-finalizada{background:rgba(76,199,130,.28);color:var(--ok);font-weight:700}
.t-enviada{background:rgba(142,155,255,.16);color:var(--blue)}
.t-finalizando{background:rgba(230,169,58,.14);color:var(--gold)}
.t-arquivos{background:transparent;color:var(--muted);border:1px dashed #3a424c}
.play{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--gold);color:#1b1408;display:grid;place-items:center;cursor:pointer}
.play svg{width:20px;height:20px}
button:focus-visible,.btn:focus-visible,label.drop:focus-within{outline:2px solid var(--fg);outline-offset:2px}
.btns{display:flex;gap:8px;margin-top:12px}
.btns[hidden]{display:none}
.btn{flex:1;text-align:center;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 8px;font-weight:600;font-size:14px;background:#20252b;cursor:pointer;font-family:inherit}
.btn small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.btn.gold{background:var(--gold);color:#1b1408;border-color:var(--gold)}
.btn.gold small{color:#5a3f10}
.btn[disabled]{opacity:.5;cursor:default}
.song.playing{border-color:var(--gold)}
.fb{margin-top:12px;border-left:3px solid var(--gold);background:#16191d;border-radius:0 10px 10px 0;padding:10px 12px;font-size:13.5px;line-height:1.5}
.fb .who{color:var(--gold);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.fb ul{margin:4px 0 0;padding-left:18px}
.fb .dt{color:var(--dim);font-size:12px;margin-top:6px}
.up{margin-top:12px;display:grid;gap:10px}
.up[hidden]{display:none}
.drop{border:1.5px dashed #3a424c;border-radius:12px;padding:16px 12px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.45;position:relative;cursor:pointer}
.drop b{color:var(--fg)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.files{display:grid;gap:8px}
.file{background:#16191d;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px}
.file .top{display:flex;justify-content:space-between;gap:10px}
.file .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.file .st{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.file.ok .st{color:var(--ok)} .file.err .st{color:var(--err)}
.prog{height:6px;background:#262b32;border-radius:99px;margin-top:7px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b9781f,var(--gold),#f6cf7a);border-radius:99px;transition:width .4s}
.file.ok .prog i{background:var(--ok)}
textarea{width:100%;min-height:64px;background:#16191d;border:1px solid var(--line);border-radius:10px;color:var(--fg);font:inherit;font-size:16px;padding:10px;resize:vertical}
.hint{color:var(--dim);font-size:12px;line-height:1.45}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0d0f12f2;border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));backdrop-filter:blur(8px)}
.bar-in{max-width:560px;margin:0 auto;display:grid;gap:6px}
.bar .now{font-size:13px;color:var(--muted)} .bar .now b{color:var(--fg)}
audio{width:100%;height:40px}
footer{color:var(--dim);font-size:12px;margin-top:26px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="logo.svg" alt="Lluizitos"><span>mix · master</span></div>
  <header>
    <div class="eyebrow">Xerife · DVD</div>
    <h1>Masters do álbum</h1>
    <div class="sub">Toque no play para ouvir aqui. MP3 e WAV baixam direto no celular.</div>
    <div class="count" id="count"></div>
  </header>
  <div class="list" id="list"></div>

  <h2>Mandar arquivos</h2>
  <div class="sub" style="margin-bottom:12px">Stems, zip, guia, MIDI, referência… qualquer coisa que eu precise. Cai direto na minha pasta.</div>
  <div class="box" id="geral"></div>

  <footer id="foot"></footer>
</div>
<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="now">Tocando: <b id="now"></b></div>
    <audio id="audio" controls preload="none"></audio>
  </div>
</div>
<script>
const ST={finalizada:"Finalizada",previa:"Prévia (em ajuste)",aprovada:"Aprovada",enviada:"Aguardando seu retorno",finalizando:"Em finalização",arquivos:"Aguardando arquivos"};
const dl=id=>"https://drive.usercontent.google.com/download?export=download&confirm=t&id="+id;
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
const audio=document.getElementById("audio");let cur=null,ENVIO="";
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
const fmt=b=>b>=1073741824?(b/1073741824).toFixed(2).replace(".",",")+" GB":b>=1048576?(b/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(b/1024))+" KB";

fetch("musicas.json?v="+Date.now()).then(r=>r.json()).then(d=>{
  ENVIO=d.envio_url||"";
  const c={finalizada:0,previa:0,aprovada:0,enviada:0,finalizando:0,arquivos:0};d.musicas.forEach(m=>c[m.status]++);
  const ct=document.getElementById("count");
  [["finalizada","finalizadas"],["previa","em prévia"],["aprovada","aprovadas"],["enviada","com você"],["finalizando","finalizando"],["arquivos","esperando arquivos"]].forEach(([k,l])=>{if(c[k]){const s=el("span");s.append(el("b",null,c[k]+" "),document.createTextNode(l));ct.append(s)}});
  const list=document.getElementById("list");
  d.musicas.forEach(m=>{
    const card=el("div","song");const row=el("div","row");
    row.append(el("div","n",m.n));
    const info=el("div","info");info.append(el("div","name",m.versao?m.nome+" ("+m.versao+")":m.nome));
    const meta=el("div","meta");if(m.versao)meta.append(el("span",null,"Versão "+m.versao));
    meta.append(el("span","tag t-"+m.status,ST[m.status]));info.append(meta);row.append(info);
    if(m.mp3){const b=el("button","play");b.type="button";b.innerHTML=PLAY;b.setAttribute("aria-label","Ouvir "+m.nome);
      b.onclick=()=>toggle(m,card,b);row.append(b)}
    card.append(row);
    if(m.mp3){const bt=el("div","btns");
      [["mp3","Baixar MP3","para ouvir"],["wav","Baixar WAV","qualidade máxima"]].forEach(([k,l,s])=>{if(!m[k])return;
        const a=el("a","btn");a.href=dl(m[k]);a.rel="noopener";a.append(document.createTextNode(l),el("small",null,s));bt.append(a)});
      card.append(bt)}
    if(m.feedback)card.append(feedback(m.feedback));
    if(m.status==="arquivos"){
      const bt=el("div","btns");const b=el("button","btn gold");b.type="button";
      b.append(document.createTextNode("Enviar arquivos"),el("small",null,"zip, wav ou stems"));bt.append(b);card.append(bt);
      const up=uploader(m.nome);up.hidden=true;card.append(up);
      b.onclick=()=>{up.hidden=false;bt.hidden=true};
    }
    list.append(card)});
  document.getElementById("geral").append(uploader("Geral"));
  if(d.feedback_geral)document.getElementById("geral").append(feedback(d.feedback_geral));
  document.getElementById("foot").textContent="Atualizado em "+d.atualizado;
});

function feedback(f){
  const b=el("div","fb");b.append(el("div","who","Retorno do Luiz"));
  if(f.texto)b.append(el("div",null,f.texto));
  if(f.itens&&f.itens.length){const ul=el("ul");f.itens.forEach(t=>ul.append(el("li",null,t)));b.append(ul)}
  if(f.data)b.append(el("div","dt",f.data));
  return b;
}

function uploader(musica){
  const w=el("div","up");
  const drop=el("label","drop");
  drop.innerHTML="<b>Escolher arquivos</b><br>toque aqui (pode escolher vários)";
  const inp=el("input");inp.type="file";inp.multiple=true;drop.append(inp);
  const files=el("div","files");
  const obs=el("textarea");obs.placeholder="Recado (opcional): ex. \"a voz certa é a VOZ 2\"";
  const send=el("button","btn gold");send.type="button";send.textContent="Enviar";send.disabled=true;
  const hint=el("div","hint","Arquivos grandes vão em partes; deixe a página aberta até ficar tudo verde.");
  w.append(drop,files,obs,send,hint);
  let sel=[];
  inp.onchange=()=>{sel=[...inp.files];files.innerHTML="";sel.forEach(f=>{f._ui=fileRow(f);files.append(f._ui.row)});send.disabled=!sel.length;send.textContent="Enviar"};
  send.onclick=async()=>{
    send.disabled=true;inp.disabled=true;send.textContent="Enviando…";let falhou=0;
    for(const f of sel){if(f._ok)continue;try{await enviar(f,musica,obs.value,f._ui)}catch(e){falhou++;f._ui.erro(e)}}
    inp.disabled=false;
    if(falhou){send.disabled=false;send.textContent="Tentar de novo"}else send.textContent="Recebido, valeu!";
  };
  return w;
}
function fileRow(f){
  const row=el("div","file");const top=el("div","top");const fn=el("div","fn",f.name);const st=el("div","st",fmt(f.size));
  top.append(fn,st);const pg=el("div","prog");const i=el("i");pg.append(i);row.append(top,pg);
  return{row,set:p=>{row.className="file";i.style.width=(p*100).toFixed(1)+"%";st.textContent=Math.floor(p*100)+"% de "+fmt(f.size)},
    ok:()=>{row.className="file ok";i.style.width="100%";st.textContent="✓ recebido"},
    erro:e=>{row.className="file err";st.textContent="falhou";console.error(e)}};
}
async function post(o){
  const r=await fetch(ENVIO,{method:"POST",body:JSON.stringify(o)});
  const j=await r.json();if(!j.ok)throw new Error(j.erro||"erro");return j;
}
const CH=32*256*1024; // 8 MB, múltiplo de 256 KB
function b64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.slice(r.result.indexOf(",")+1));r.onerror=rej;r.readAsDataURL(blob)})}
async function enviar(f,musica,obs,ui){
  if(!ENVIO)throw new Error("sem endereço de envio");
  ui.set(0);
  const s=await post({acao:"iniciar",musica,nome:f.name,tamanho:f.size,tipo:f.type||"application/octet-stream",obs});
  let ini=0;
  while(ini<f.size){
    const fim=Math.min(ini+CH,f.size);const dados=await b64(f.slice(ini,fim));
    let j,t=0;
    for(;;){try{j=await post({acao:"pedaco",sessao:s.sessao,inicio:ini,total:f.size,dados});break}
      catch(e){if(++t>=4)throw e;await new Promise(r=>setTimeout(r,1500*t))}}
    ini=fim;ui.set(ini/f.size);
    if(j.fim)break;
  }
  f._ok=true;ui.ok();
}

function toggle(m,card,b){
  if(cur&&cur.m===m){if(audio.paused)audio.play();else audio.pause();return}
  if(cur){cur.card.classList.remove("playing");cur.b.innerHTML=PLAY}
  cur={m,card,b};card.classList.add("playing");
  audio.src=m.ouvir||dl(m.mp3);document.getElementById("now").textContent=m.nome+" ("+m.versao+")";
  document.getElementById("bar").hidden=false;audio.play().catch(()=>{});
}
audio.onplay=()=>{if(cur)cur.b.innerHTML=PAUSE};
audio.onpause=()=>{if(cur)cur.b.innerHTML=PLAY};
</script>
</body>
</html>
